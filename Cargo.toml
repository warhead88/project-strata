[workspace]
members = ["crates/*"]
default-members = ["crates/strata-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui"] }
strata-globe = { path = "crates/strata-globe" }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
overflow-checks = true
